# The claim-verification suite: stdlib + pytest, no game engine, no ROM, no
# network. If this is green, every number the paper tables is re-derivable from
# the committed artifacts in data/ — the demonstrations' directly, and the
# prevalence screen's by checking the published counts against its artifact.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: pytest -q
